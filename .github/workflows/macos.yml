name: Build macOS CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - macos-arm64

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build headless CLI package
        env:
          VERSION: "0.4.3"
        run: ./scripts/build-macos-cli.sh

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-switch-macos-arm64-cli
          path: dist/Grok-Build-Switch-macos-arm64-cli-v0.4.3.zip
          if-no-files-found: error
          retention-days: 14
